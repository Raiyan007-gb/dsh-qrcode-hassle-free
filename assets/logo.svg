<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="dsh-remote-tunnel-easy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f24"/>
      <stop offset="1" stop-color="#1b1440"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b8cff"/>
      <stop offset="0.55" stop-color="#b887ff"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#6b8cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6b8cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="880" height="200" rx="26" fill="url(#bg)"/>
  <rect x="0" y="0" width="880" height="200" rx="26" fill="url(#glow)"/>
  <rect x="0" y="0" width="880" height="200" rx="26" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="879" height="199" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>

  <!-- QR tile -->
  <rect x="36" y="36" width="128" height="128" rx="22" fill="#ffffff"/>
  <g fill="#101c33">
    <rect x="48" y="48" width="34" height="34" rx="4"/>
    <rect x="53" y="53" width="24" height="24" rx="3" fill="#ffffff"/>
    <rect x="58" y="58" width="14" height="14" rx="2"/>
    <rect x="118" y="48" width="34" height="34" rx="4"/>
    <rect x="123" y="53" width="24" height="24" rx="3" fill="#ffffff"/>
    <rect x="128" y="58" width="14" height="14" rx="2"/>
    <rect x="48" y="118" width="34" height="34" rx="4"/>
    <rect x="53" y="123" width="24" height="24" rx="3" fill="#ffffff"/>
    <rect x="58" y="128" width="14" height="14" rx="2"/>
    <rect x="90" y="52" width="9" height="9"/>
    <rect x="103" y="52" width="9" height="9"/>
    <rect x="90" y="65" width="9" height="9"/>
    <rect x="99" y="74" width="9" height="9"/>
    <rect x="112" y="74" width="9" height="9"/>
    <rect x="52" y="90" width="9" height="9"/>
    <rect x="65" y="90" width="9" height="9"/>
    <rect x="52" y="103" width="9" height="9"/>
    <rect x="90" y="90" width="9" height="9"/>
    <rect x="103" y="99" width="9" height="9"/>
    <rect x="116" y="90" width="9" height="9"/>
    <rect x="129" y="99" width="9" height="9"/>
    <rect x="90" y="112" width="9" height="9"/>
    <rect x="116" y="112" width="9" height="9"/>
    <rect x="129" y="125" width="9" height="9"/>
    <rect x="142" y="125" width="9" height="9"/>
    <rect x="90" y="138" width="9" height="9"/>
    <rect x="103" y="138" width="9" height="9"/>
    <rect x="116" y="138" width="9" height="9"/>
  </g>
  <circle cx="142" cy="65" r="6" fill="#5eead4"/>

  <!-- Handoff arc: QR -> phone -->
  <path d="M168 84 C 188 84, 190 96, 204 100" fill="none" stroke="url(#flow)" stroke-width="5" stroke-linecap="round"/>
  <path d="M168 116 C 188 116, 190 108, 204 104" fill="none" stroke="url(#flow)" stroke-width="5" stroke-linecap="round" opacity="0.55"/>

  <!-- Phone glyph -->
  <rect x="206" y="58" width="46" height="84" rx="11" fill="#0d1430" stroke="url(#flow)" stroke-width="4"/>
  <rect x="218" y="64" width="22" height="4" rx="2" fill="#5eead4" opacity="0.8"/>
  <circle cx="229" cy="132" r="3.4" fill="#5eead4"/>

  <!-- Wordmark -->
  <text x="272" y="92" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#f6f7ff" letter-spacing="0.5">dsh-remote-tunnel-easy</text>
  <text x="274" y="124" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#aeb9ff">Remote access for DeepSeek Harness — scan, open, keep working.</text>
  <rect x="274" y="138" width="150" height="5" rx="2.5" fill="url(#flow)"/>
</svg>
