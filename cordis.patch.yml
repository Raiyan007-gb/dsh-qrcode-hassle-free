# Bundle patch for qrcode-hassle-free: prints the tunnel access link and its
# QR code to the `dsh web` terminal on every start, and seeds the app's
# persisted session selection so a phone scan lands in the harness's most
# recently active session. No database, no Firebase, no persisted state —
# the link is regenerated fresh each run.

- insert:
    - id: qrcode-hassle-free
      name: 'qrcode-hassle-free'
      config:
        tunnelTarget: 'http://localhost:3080'
        cloudflaredPath: 'cloudflared'
        sessionHandoff: true
